<section class="header-section width_control">
    <section class="header">
        <img class="logo mobile-logo" src="icons/logo/FKLogo.png" alt="Logo">

        <div class="left-side-header">
            <div class="lang-switch">
                <button [class.active]="currentLang() === 'en'" (click)="useLanguage('en')">EN</button>
                <button [class.active]="currentLang() === 'de'" (click)="useLanguage('de')">DE</button>
            </div>
            <a href="#aboutme">{{"header.aboutme" | translate}}</a>
            <a href="#skills">{{"header.skills" | translate}}</a>
            <a href="#portfolio">{{"header.projects" | translate}}</a>
        </div>
        <img class="logo desktop-logo" src="icons/logo/FKLogo.png" alt="Logo">

        <button class="mobile-menu-button" type="button" (click)="toggleMobileMenu()" aria-label="Open navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        @if (isMobileMenuOpen()) {
        <div class="mobile-menu-dialog">
            <a href="#aboutme" (click)="closeMobileMenu()">{{"header.aboutme" | translate}}</a>
            <a href="#skills" (click)="closeMobileMenu()">{{"header.skills" | translate}}</a>
            <a href="#portfolio" (click)="closeMobileMenu()">{{"header.projects" | translate}}</a>
            <div class="lang-switch mobile-lang-switch">
                <button [class.active]="currentLang() === 'en'" (click)="useLanguage('en'); closeMobileMenu()">EN</button>
                <button [class.active]="currentLang() === 'de'" (click)="useLanguage('de'); closeMobileMenu()">DE</button>
            </div>
        </div>
        }
</section>
